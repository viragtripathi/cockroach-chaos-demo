# A two-cloud stretch cluster in one metro: AWS and Azure serve every payment, a single GCP node breaks ties.
# Every range keeps a copy on all five nodes, so losing a whole cloud still leaves a majority (3 of 5).
display_name: Global Payments
cluster_id: global-payments
survival_goal: region
latency: realistic
regions:
  - { name: us-east-1, provider: aws, nodes: 2, primary: true }
  - { name: eastus, provider: azure, nodes: 2, secondary: true }
  - { name: us-east4, provider: gcp, nodes: 1, tie_breaker: true }
